# Network Latency Management Policy
# Version: 1.0
# Last Updated: 2025-09-11

policy:
  name: "Latency-Based WAN Rerouting Policy"
  description: "Automated WAN rerouting based on network latency thresholds"
  version: "1.0"
  
  # Latency Thresholds Configuration
  thresholds:
    critical:
      latency_ms: 150
      description: "Critical latency - requires immediate action"
      action: "reroute_to_3_wans"
      
    high:
      latency_ms: 100
      description: "High latency - requires load balancing"
      action: "reroute_to_2_wans"
      
    medium:
      latency_ms: 70
      description: "Medium latency - monitor and balance"
      action: "reroute_to_2_wans"
      
    low:
      latency_ms: 0
      description: "Low latency - no action required"
      action: "no_action"

  # WAN Rerouting Rules
  rerouting_rules:
    critical_latency:
      condition: "latency > 150ms"
      wans_required: 3
      distribution: "equal"
      description: "Reroute devices equally across 3 WANs"
      
    high_latency:
      condition: "latency 100-150ms"
      wans_required: 2
      distribution: "equal"
      description: "Reroute devices equally across 2 WANs"
      
    medium_latency:
      condition: "latency 70-100ms"
      wans_required: 2
      distribution: "equal"
      description: "Reroute devices equally across 2 WANs"
      
    low_latency:
      condition: "latency < 70ms"
      wans_required: 0
      distribution: "none"
      description: "No rerouting required"

  # Device Management
  device_management:
    priority_devices:
      - "voip_devices"
      - "critical_applications"
      - "video_conferencing"
    
    rerouting_algorithm: "round_robin"
    failover_timeout: "30s"
    health_check_interval: "60s"

  # Monitoring Configuration
  monitoring:
    data_source: "appliance_settings"
    metrics:
      - "latency_ms"
      - "jitter_ms"
      - "packet_loss_percent"
      - "goodput_percent"
    
    alerting:
      enabled: true
      thresholds:
        latency_alert: 100
        jitter_alert: 10
        packet_loss_alert: 5

  # Execution Workflow
  execution:
    steps:
      1: "Get latency from appliance settings"
      2: "Get device list from uplink statuses"
      3: "Check latency against policy thresholds"
      4: "Execute rerouting based on policy rules"
      5: "Report final rerouting results"
    
    timeout: "300s"
    retry_attempts: 3
    retry_delay: "10s"

  # Reporting
  reporting:
    format: "json"
    include_metrics: true
    include_device_list: true
    include_rerouting_summary: true
    
    output_template: |
      {
        "status": "completed",
        "latency_detected": "{{latency}}ms",
        "threshold_category": "{{category}}",
        "devices_rerouted": {{count}},
        "wan_distribution": {
          "wan1": {{wan1_count}},
          "wan2": {{wan2_count}},
          "wan3": {{wan3_count}}
        },
        "timestamp": "{{timestamp}}"
      }
